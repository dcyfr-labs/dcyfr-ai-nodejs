name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NPM_CONFIG_PROVENANCE: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        # Only mint when org-level RELEASE_APP_ID is set. `continue-on-error`
        # makes the workflow degrade-safe: if the App isn't installed on this
        # repo yet, or secrets are missing, mint fails non-fatally and the
        # fallback chain picks up RELEASE_TOKEN.
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT with `workflow` scope when available — GITHUB_TOKEN cannot push
          # tags on commits touching .github/workflows/* (server-side reject).
          # Falls back cleanly; degraded mode no-ops tag push for such releases.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        # `npm install` (not `npm ci`) — package-lock.json is intentionally
        # gitignored (template pattern; users get a fresh lockfile when they
        # clone the template). The `ci` variant requires a tracked lockfile.
        run: npm install

      - name: Upgrade npm for Trusted Publishing
        # npm 11.5+ is required for OIDC Trusted Publishing. The runner's
        # bundled npm already meets this; pinning to latest guards against
        # version drift in future runner images.
        run: npm install -g npm@latest

      - name: Build
        run: npm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

